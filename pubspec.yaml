name: tucolmadord
description: "TuColmadoRD — punto de venta offline-first para colmados."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  get_it: ^7.7.0
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^1.1.3
  path: ^1.9.0
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
